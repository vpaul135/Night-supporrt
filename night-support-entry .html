function fmtDate(s){ if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; }
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function houseSlug(house){ return house.name.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }

let state = {
  participants: [],
  houses: [],
  staff: [],
  nightLogs: [],
  cloudReady: false,
  cloudError: null,
};
function participantName(id){ return state.participants.find(p=>p.id===id)?.name || "Unknown"; }
function houseName(id){ return state.houses.find(h=>h.id===id)?.name || "—"; }

let realtimeChannel = null;
async function bootCloudData(){
  try{
    const [housesRes, staffRes, partsRes] = await Promise.all([
      sb.from("houses").select("*"),
      sb.from("staff").select("*"),
      sb.from("participants").select("*"),
    ]);
    if(housesRes.error) throw housesRes.error;
    if(staffRes.error) throw staffRes.error;
    if(partsRes.error) throw partsRes.error;
    state.houses = (housesRes.data||[]).map(h=>({ id:h.id, name:h.name, pin:h.pin||"" }));
    state.staff = (staffRes.data||[]).map(s=>({ id:s.id, name:s.name }));
    state.participants = (partsRes.data||[]).map(p=>({ id:p.id, name:p.name, houseId:p.house_id, active:p.active }));
    state.cloudReady = true;
  }catch(e){
    console.error("Supabase load failed", e);
    state.cloudError = e.message || "Could not reach the cloud database.";
  }
  routeRender();
  subscribeRealtime();
}
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel("night-support-entry-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"houses" }, ()=>{
      sb.from("houses").select("*").then(({data})=>{ if(data){ state.houses = data.map(h=>({id:h.id,name:h.name,pin:h.pin||""})); routeRender(); } });
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"participants" }, ()=>{
      sb.from("participants").select("*").then(({data})=>{ if(data){ state.participants = data.map(p=>({id:p.id,name:p.name,houseId:p.house_id,active:p.active})); routeRender(); } });
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"staff" }, ()=>{
      sb.from("staff").select("*").then(({data})=>{ if(data){ state.staff = data.map(s=>({id:s.id,name:s.name})); routeRender(); } });
    })
    .subscribe();
}

function initDarkMode(){
  const saved = localStorage.getItem("ndis-theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  if(saved === "dark" || (!saved && prefersDark)) document.documentElement.classList.add("dark");
}
function toggleDarkMode(){
  const isDark = document.documentElement.classList.toggle("dark");
  localStorage.setItem("ndis-theme", isDark ? "dark" : "light");
  routeRender();
}
initDarkMode();

function resolveRoute(){
  const path = location.pathname.replace(/\/+$/,"");
  const params = new URLSearchParams(location.search);
  const pathSlug = path.split("/night-support-entry/")[1]; // works if host rewrites /night-support-entry/* here
  const slug = pathSlug || params.get("house");
  if(slug) return { mode:"staff", slug };
  return { mode:"directory" };
}
function routeRender(){
  if(state.cloudError){
    document.getElementById("app").innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-sm text-center">
          <i data-lucide="cloud-off" class="w-10 h-10 text-rose-500 mx-auto mb-3"></i>
          <div class="font-semibold text-slate-700 dark:text-slate-200 mb-1">Can't reach the cloud database</div>
          <p class="text-sm text-slate-500 dark:text-slate-400">${esc(state.cloudError)}</p>
          <button onclick="location.reload()" class="mt-4 bg-indigo-700 hover:bg-indigo-800 text-white text-sm px-4 py-2 rounded-lg">Try again</button>
        </div>
      </div>`;
    lucide.createIcons();
    return;
  }
  const route = resolveRoute();
  if(route.mode === "staff") renderStaffGate(route.slug);
  else renderDirectory();
}

/* ---------------------------------------------------------
   Staff side — PIN gate (if set) then the submission form
--------------------------------------------------------- */
function findHouseBySlug(slug){
  const candidates = state.houses.filter(h=>houseSlug(h)===slug || h.id===slug);
  if(candidates.length<=1) return candidates[0];
  // Duplicate house names can produce two rows with the same slug (e.g. one
  // created locally before Supabase was connected, one created after). Prefer
  // whichever one actually has participants pointing at it, so staff don't
  // land on an empty "orphan" copy of the house.
  const withParticipants = candidates.find(h=>state.participants.some(p=>p.houseId===h.id));
  return withParticipants || candidates[0];
}
function houseUnlocked(houseId){ return localStorage.getItem("ndis-house-unlocked-"+houseId) === "1"; }
function unlockHouse(houseId){ localStorage.setItem("ndis-house-unlocked-"+houseId, "1"); }

function renderStaffGate(slug){
  const app = document.getElementById("app");
  const house = findHouseBySlug(slug);
  if(!house){
    app.innerHTML = `${brandHeader("Link not found")}
      <div class="p-6 max-w-md mx-auto text-center">
        <div class="text-4xl mb-2">🔍</div>
        <div class="font-bold text-lg mb-1">House not found</div>
        <div class="text-sm text-slate-500 dark:text-slate-400">Check the link, or ask your manager for the correct one.</div>
      </div>`;
    lucide.createIcons();
    return;
  }
  if(house.pin && !houseUnlocked(house.id)){ renderPinPad(house); return; }
  nightLogDraft = nightLogDraft && nightLogDraft.houseId===house.id ? nightLogDraft : freshNightLogDraft(house.id);
  renderStaffForm(house);
}

let pinEntry = "";
function renderPinPad(house){
  const app = document.getElementById("app");
  app.innerHTML = `
    ${brandHeader(house.name)}
    <div class="p-6 max-w-xs mx-auto text-center">
      <i data-lucide="lock" class="w-8 h-8 mx-auto text-indigo-700 dark:text-indigo-400 mb-2"></i>
      <div class="font-semibold mb-3">Enter House PIN</div>
      <div id="pin-dots" class="flex justify-center gap-2 mb-4">${[0,1,2,3].map(i=>`<div class="w-3.5 h-3.5 rounded-full border-2 border-indigo-700 ${pinEntry.length>i?"bg-indigo-700":""}"></div>`).join("")}</div>
      <div class="grid grid-cols-3 gap-2">
        ${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?`<div></div>`:`
          <button onclick="pinPress('${k}','${house.id}')" class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg py-3.5 text-lg font-semibold">${k}</button>`).join("")}
      </div>
      <div id="pin-error" class="text-rose-600 text-xs mt-3 hidden">Incorrect PIN — try again.</div>
    </div>`;
  lucide.createIcons();
}
function pinPress(k, houseId){
  const house = state.houses.find(h=>h.id===houseId);
  if(k==="⌫"){ pinEntry = pinEntry.slice(0,-1); renderPinPad(house); return; }
  if(pinEntry.length>=4) return;
  pinEntry += String(k);
  if(pinEntry.length===4){
    if(pinEntry===house.pin){ unlockHouse(house.id); pinEntry=""; renderStaffGate(houseSlug(house)); }
    else{
      document.getElementById("pin-error")?.classList.remove("hidden");
      setTimeout(()=>{ pinEntry=""; renderPinPad(house); }, 500);
    }
  } else {
    renderPinPad(house);
  }
}

/* ---------------------------------------------------------
   Night log draft + shared form (staff view)
--------------------------------------------------------- */
let nightLogDraft = null;
let interventionDraft = null;
let nightLogSubmittedSuccess = false;

function freshNightLogDraft(houseId){
  return { houseId, participantId:"", date: today(), staffName:"", shiftStart:"", shiftFinish:"", interventions:[], overallNight:"Quiet Night", comments:"" };
}
function nightLogTotals(){
  const total = nightLogDraft.interventions.length;
  const minutes = nightLogDraft.interventions.reduce((s,iv)=>s+(Number(iv.duration)||0),0);
  return { total, minutes };
}
function nightRatingClasses(rating, selected){
  const tone = NIGHT_RATING_TONE[rating] || "emerald";
  if(!selected) return "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-600";
  const map = { emerald:"bg-emerald-600 text-white border-emerald-600", amber:"bg-amber-600 text-white border-amber-600", rose:"bg-rose-600 text-white border-rose-600" };
  return map[tone];
}

/* Staff name — dropdown of names set up in the Roster of Care admin app
   (Participants tab -> Staff manager), with an "Other" fallback so the form
   still works if someone's name isn't on the list yet. */
function staffNameFieldHtml(){
  const knownNames = state.staff.map(s=>s.name);
  const isKnown = knownNames.includes(nightLogDraft.staffName);
  const useOther = nightLogDraft.staffOther || (nightLogDraft.staffName && !isKnown);
  if(!state.staff.length || useOther){
    return `<div class="flex gap-2">
      <input required value="${esc(nightLogDraft.staffName)}" oninput="nightLogDraft.staffName=this.value" class="${inputCls} text-base flex-1" placeholder="Your name" />
      ${state.staff.length ? `<button type="button" onclick="nightLogDraft.staffOther=false; nightLogDraft.staffName=''; renderStaffForm(findHouseBySlug(resolveRoute().slug)||{id:nightLogDraft.houseId,name:''})" class="text-xs text-indigo-700 dark:text-indigo-400 shrink-0 px-2">Pick from list</button>` : ""}
    </div>`;
  }
  return `<select required onchange="setStaffNameSelect(this.value)" class="${inputCls} text-base">
    <option value="">Select your name…</option>
    ${knownNames.map(n=>`<option value="${esc(n)}" ${nightLogDraft.staffName===n?"selected":""}>${esc(n)}</option>`).join("")}
    <option value="__other__">Other (type name)…</option>
  </select>`;
}
function setStaffNameSelect(val){
  if(val === "__other__"){ nightLogDraft.staffOther = true; nightLogDraft.staffName = ""; }
  else { nightLogDraft.staffOther = false; nightLogDraft.staffName = val; }
  const house = state.houses.find(h=>h.id===nightLogDraft.houseId);
  renderStaffForm(house || {id:nightLogDraft.houseId, name:""});
}

function renderStaffForm(house){
  const app = document.getElementById("app");
  if(nightLogSubmittedSuccess){
    app.innerHTML = `${brandHeader(house.name)}
      <div class="p-6 max-w-md mx-auto text-center">
        <div class="text-5xl mb-3">✅</div>
        <div class="font-bold text-xl mb-1 font-display">Night log submitted</div>
        <div class="text-sm text-slate-500 dark:text-slate-400 mb-5">Thanks — you can close this window, or submit another log.</div>
        <button onclick="nightLogSubmittedSuccess=false; nightLogDraft=freshNightLogDraft('${house.id}'); renderStaffForm(state.houses.find(h=>h.id==='${house.id}'));" class="bg-indigo-800 hover:bg-indigo-900 text-white font-semibold px-5 py-3 rounded-xl">Submit another log</button>
      </div>`;
    lucide.createIcons();
    return;
  }
  const participants = state.participants.filter(p=>p.houseId===house.id && p.active!==false);
  app.innerHTML = `
    ${brandHeader(house.name)}
    <div class="p-4 max-w-lg mx-auto pb-10">${nightLogFormHtml(house, participants)}</div>`;
  lucide.createIcons();
}

function nightLogFormHtml(house, participants){
  const { total, minutes } = nightLogTotals();
  const ivRows = nightLogDraft.interventions.map((iv,i)=>{
    const r = NIGHT_REASONS.find(rr=>rr.value===iv.reason);
    return `
    <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-900 rounded-lg px-3 py-2 mb-2">
      <div class="text-lg">${r?.icon||"➕"}</div>
      <div class="flex-1 text-sm">
        <div class="font-medium text-slate-800 dark:text-slate-100">${esc(iv.time||"—")} · ${esc(iv.reason)}</div>
        <div class="text-xs text-slate-500 dark:text-slate-400">${esc(iv.support||"")}${iv.duration?` · ${iv.duration} min`:""}${iv.returnedToSleep!=null ? ` · Returned to sleep: ${iv.returnedToSleep?"Yes":"No"}` : ""}</div>
      </div>
      <button onclick="removeIntervention(${i})" class="text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>`;
  }).join("");

  if(participants.length===0){
    const duplicateHouses = state.houses.filter(h=>houseSlug(h)===houseSlug(house));
    const anyParticipantsAssignedElsewhere = state.participants.some(p=>p.houseId);
    return `<div class="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800 rounded-lg p-4 text-sm text-amber-800 dark:text-amber-300">
      No participants are assigned to ${esc(house.name)} yet. Ask your manager to assign them in the Roster of Care app's Participants tab.
      ${duplicateHouses.length>1 ? `<div class="mt-2 pt-2 border-t border-amber-200 dark:border-amber-800 text-xs">Note: ${duplicateHouses.length} houses share this same name/link — this could be an old duplicate. House IDs matching this link: ${duplicateHouses.map(h=>esc(h.id)).join(", ")}. Ask your manager to check the Houses list for a duplicate "${esc(house.name)}" entry and delete the one with no participants.</div>` : ""}
      ${duplicateHouses.length<=1 && anyParticipantsAssignedElsewhere ? `<div class="mt-2 pt-2 border-t border-amber-200 dark:border-amber-800 text-xs">This house's ID is ${esc(house.id)} — other participants are assigned to a different house, so the assignment itself may be pointing at a different ID than expected.</div>` : ""}
    </div>`;
  }

  return `
    ${field("Participant", `<select onchange="nightLogDraft.participantId=this.value" class="${inputCls} text-base">
      <option value="">Select participant…</option>
      ${participants.map(p=>`<option value="${p.id}" ${nightLogDraft.participantId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}
    </select>`)}
    <div class="grid grid-cols-2 gap-3">
      ${field("Date", `<input type="date" value="${nightLogDraft.date}" onchange="nightLogDraft.date=this.value" class="${inputCls}" />`)}
      ${field("House", `<input disabled class="${inputCls} bg-slate-100 dark:bg-slate-800" value="${esc(house.name)}" />`)}
    </div>
    ${field("Staff name", staffNameFieldHtml())}
    <div class="grid grid-cols-2 gap-3">
      ${field("Shift start", `<input type="time" value="${nightLogDraft.shiftStart}" onchange="nightLogDraft.shiftStart=this.value" class="${inputCls} text-base" />`)}
      ${field("Shift finish", `<input type="time" value="${nightLogDraft.shiftFinish}" onchange="nightLogDraft.shiftFinish=this.value" class="${inputCls} text-base" />`)}
    </div>

    <div class="border-t border-slate-200 dark:border-slate-700 mt-3 pt-3">
      <div class="flex items-center mb-2">
        <div class="text-sm font-semibold text-slate-700 dark:text-slate-200">Interventions (${total})</div>
        <button onclick="openInterventionModal()" class="ml-auto bg-indigo-700 hover:bg-indigo-800 text-white text-sm font-medium px-3 py-2.5 rounded-lg flex items-center gap-1"><i data-lucide="plus" class="w-4 h-4"></i>Add Intervention</button>
      </div>
      ${ivRows || `<div class="text-xs text-slate-400 dark:text-slate-500 mb-2">No interventions added yet.</div>`}
    </div>

    <div class="border-t border-slate-200 dark:border-slate-700 mt-3 pt-3">
      <div class="grid grid-cols-2 gap-3 mb-1">
        ${field("Total interventions", `<input disabled class="${inputCls} bg-slate-100 dark:bg-slate-800" value="${total}" />`)}
        ${field("Estimated total minutes", `<input disabled class="${inputCls} bg-slate-100 dark:bg-slate-800" value="${minutes}" />`)}
      </div>
      ${field("Overall night", `<div class="grid grid-cols-2 gap-2">${NIGHT_RATINGS.map(r=>`
        <button type="button" onclick="setOverallNight('${r}')" class="text-sm font-medium px-3 py-3 rounded-lg border ${nightRatingClasses(r, nightLogDraft.overallNight===r)}">${r}</button>`).join("")}</div>`)}
      ${field("Comments (optional)", `<textarea rows="2" class="${inputCls}" oninput="nightLogDraft.comments=this.value">${esc(nightLogDraft.comments)}</textarea>`)}

  `;
}

        </div>`)}
        <button onclick="submitIntervention()" class="w-full bg-indigo-800 hover:bg-indigo-900 text-white font-semibold py-3 rounded-xl mt-2">Add</button>
      </div>
    </div>
  </div>`;
  lucide.createIcons();
}
function setInterventionReason(v){ interventionDraft.reason = v; renderInterventionModal(); }
function setReturnedToSleep(v){ interventionDraft.returnedToSleep = v; renderInterventionModal(); }
function submitIntervention(){
  nightLogDraft.interventions.push({ ...interventionDraft });
  closeInterventionModal();
  routeRender();
}
function removeIntervention(i){ nightLogDraft.interventions.splice(i,1); routeRender(); }
function setOverallNight(r){ nightLogDraft.overallNight = r; routeRender(); }

async function submitNightLog(){
  if(!nightLogDraft.participantId){ alert("Please select which participant this log is for."); return; }
  if(!nightLogDraft.staffName.trim()){ alert("Please enter the staff name."); return; }
  if(!nightLogDraft.shiftStart || !nightLogDraft.shiftFinish){ alert("Please enter shift start and finish times."); return; }
  const { total, minutes } = nightLogTotals();
  const log = {
    id: uid(), createdAt: new Date().toISOString(),
    participantId: nightLogDraft.participantId, houseId: nightLogDraft.houseId, date: nightLogDraft.date,
    staffName: nightLogDraft.staffName, shiftStart: nightLogDraft.shiftStart, shiftFinish: nightLogDraft.shiftFinish,
    interventions: nightLogDraft.interventions, totalInterventions: total, totalMinutes: minutes,
    overallNight: nightLogDraft.overallNight, comments: nightLogDraft.comments,
  };
  const submitBtn = document.getElementById("submit-night-log-btn");
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Saving…"; }
  const { error } = await sb.from("night_logs").insert({
    id: log.id, created_at: log.createdAt, participant_id: log.participantId, house_id: log.houseId, date: log.date,
    staff_name: log.staffName, shift_start: log.shiftStart, shift_finish: log.shiftFinish,
    interventions: log.interventions, total_interventions: log.totalInterventions, total_minutes: log.totalMinutes,
    overall_night: log.overallNight, comments: log.comments,
  });
  if(error){
    console.error(error);
    alert("Could not save — check the internet connection and try again. Nothing was lost from this form.");
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Save Record"; }
    return;
  }
  if(!state.nightLogs.some(l=>l.id===log.id)) state.nightLogs.push(log);
  nightLogSubmittedSuccess = true;
  routeRender();
}

initDarkMode();
document.getElementById("app").innerHTML = `<div class="min-h-screen flex items-center justify-center text-slate-400 text-sm">Loading…</div>`;
bootCloudData();
</script>
