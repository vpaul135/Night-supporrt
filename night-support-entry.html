const SUPABASE_URL = "https://lxcfabnjphnqgjvzghjm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_TTQkbq7bgCQM6QLzT2W81Q_HSgAgAoY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DEFAULT_CATEGORIES = ["Sleeping","Awake","Toileting","Repositioning","Medication","Behaviour","Welfare Check","Other"];
const DEFAULT_ACTIVITY_TYPES = ["Community Access","Shopping","Pickup","Drop-off","Appointment","Other"];

function uid(){ return "id-"+Date.now()+"-"+Math.random().toString(16).slice(2); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function houseSlug(h){ return h.name.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
function minsBetween(a,b){ if(!a||!b) return 0; const [ah,am]=a.split(":").map(Number),[bh,bm]=b.split(":").map(Number); let m=(bh*60+bm)-(ah*60+am); if(m<0) m+=1440; return m; }
function houseUnlocked(id){ return localStorage.getItem("ndis-house-unlocked-"+id)==="1"; }
function unlockHouse(id){ localStorage.setItem("ndis-house-unlocked-"+id,"1"); }

let state = { houses: [], participants: [], interventionTypes: [], supportTypes: [], cloudError: null };
function nightCategories(){
  const active = state.interventionTypes.filter(t=>t.active!==false).sort((a,b)=>a.sortOrder-b.sortOrder).map(t=>t.label);
  return active.length ? active : DEFAULT_CATEGORIES;
}
function supportActivityTypes(){
  const active = state.supportTypes.filter(t=>t.active!==false).sort((a,b)=>a.sortOrder-b.sortOrder).map(t=>t.label);
  return active.length ? active : DEFAULT_ACTIVITY_TYPES;
}
let view = "home";          // home | pin | chooser | nightlog | support | success
let activeHouseId = null;
let pinEntry = "";
let successKind = "";

/* ---------- Cloud boot ---------- */
async function boot(){
  try{
    const [hRes, pRes] = await Promise.all([ sb.from("houses").select("*"), sb.from("participants").select("*") ]);
    if(hRes.error) throw hRes.error;
    state.houses = (hRes.data||[]).filter(h=>h.active!==false).map(h=>({ id:h.id, name:h.name, pin:h.pin||"" }));
    state.participants = (pRes.data||[]).map(p=>({ id:p.id, name:p.name, houseId:p.house_id, active:p.active!==false }));
  }catch(e){
    console.error(e);
    state.cloudError = e.message || "Could not reach the server.";
  }
  // Intervention/support types are optional — if either table is empty,
  // missing, or fails to load, nightCategories()/supportActivityTypes()
  // fall back to the fixed default lists, so a problem here never blocks
  // the rest of the app.
  try{
    const iRes = await sb.from("intervention_types").select("*");
    if(!iRes.error) state.interventionTypes = (iRes.data||[]).map(t=>({ id:t.id, label:t.label, sortOrder:t.sort_order||0, active:t.active!==false }));
  }catch(e){ console.error("intervention_types load failed, using defaults", e); }
  try{
    const sRes = await sb.from("support_types").select("*");
    if(!sRes.error) state.supportTypes = (sRes.data||[]).map(t=>({ id:t.id, label:t.label, sortOrder:t.sort_order||0, active:t.active!==false }));
  }catch(e){ console.error("support_types load failed, using defaults", e); }

  render();
  handleHouseLink();
  sb.channel("staff-portal-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"houses" }, ()=>{
      sb.from("houses").select("*").then(({data})=>{ if(data){ state.houses = data.filter(h=>h.active!==false).map(h=>({id:h.id,name:h.name,pin:h.pin||""})); render(); } });
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"participants" }, ()=>{
      sb.from("participants").select("*").then(({data})=>{ if(data){ state.participants = data.map(p=>({id:p.id,name:p.name,houseId:p.house_id,active:p.active!==false})); render(); } });
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"intervention_types" }, ()=>{
      sb.from("intervention_types").select("*").then(({data,error})=>{ if(!error && data){ state.interventionTypes = data.map(t=>({id:t.id,label:t.label,sortOrder:t.sort_order||0,active:t.active!==false})); render(); } });
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"support_types" }, ()=>{
      sb.from("support_types").select("*").then(({data,error})=>{ if(!error && data){ state.supportTypes = data.map(t=>({id:t.id,label:t.label,sortOrder:t.sort_order||0,active:t.active!==false})); render(); } });
    })
    .subscribe();
}

/* ---------- Shared shell ---------- */
function handleHouseLink(){
  // Preserves the per-house bookmarked links generated by the Admin Panel's
  // "Copy Link" button (night-support-entry.html?house=<slug>) — opens
  // straight to that house instead of the full house list.
  if(view!=="home" || activeHouseId) return;
  const params = new URLSearchParams(location.search);
  const slug = params.get("house");
  if(!slug) return;
  const house = state.houses.find(h=>houseSlug(h)===slug || h.id===slug);
  if(house) openHouse(house.id);
}
function header(subtitle){
  return `<div class="bg-indigo-800 text-white px-5 py-5 flex items-center gap-3">
    <img src="${LOGO_B64}" class="h-9 w-auto bg-white rounded px-1.5 py-1" alt="${esc(BRAND_NAME)}" />
    <div><div class="font-bold font-display text-lg leading-tight">${esc(BRAND_NAME)}</div>
    <div class="text-xs text-indigo-200">${esc(subtitle)}</div></div>
  </div>`;
}
function backBtn(onclick, label){
  return `<button onclick="${onclick}" class="tap flex items-center gap-1.5 text-indigo-700 dark:text-indigo-400 font-medium text-sm mb-4"><span class="text-lg leading-none">‹</span>${esc(label||"Back")}</button>`;
}
const inputCls = "w-full border-2 border-slate-200 dark:border-slate-700 dark:bg-slate-800 rounded-xl px-4 py-3.5 text-base focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600";
function field(label, inner){ return `<div class="mb-4"><label class="block text-sm font-semibold text-slate-600 dark:text-slate-300 mb-1.5">${esc(label)}</label>${inner}</div>`; }

function render(){
  const app = document.getElementById("app");
  if(state.cloudError){
    app.innerHTML = `${header("Staff Portal")}
      <div class="p-6 text-center max-w-sm mx-auto">
        <div class="text-4xl mb-3">📡</div>
        <div class="font-bold text-lg mb-1">Can't reach the server</div>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">${esc(state.cloudError)}</p>
        <button onclick="location.reload()" class="tap bg-indigo-700 text-white font-semibold px-5 py-3 rounded-xl">Try again</button>
      </div>`;
    return;
  }
  if(view==="home") return renderHome();
  if(view==="pin") return renderPin();
  if(view==="nightlog") return renderNightLog();
  if(view==="support") return renderSupport();
  if(view==="success") return renderSuccess();
}

/* ---------- Home — houses only ---------- */
function renderHome(){
  const app = document.getElementById("app");
  const rows = state.houses.map(h=>`
    <button onclick="openHouse('${h.id}')" class="tap w-full flex items-center gap-3 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-5 mb-3 text-left active:scale-[0.98] transition-transform">
      <span class="text-3xl">🏠</span>
      <span class="text-lg font-semibold flex-1">${esc(h.name)}</span>
      ${h.pin ? `<span class="text-slate-300 dark:text-slate-600 text-xl">🔒</span>` : `<span class="text-indigo-400 text-2xl">›</span>`}
    </button>`).join("");
  app.innerHTML = `
    ${header("Staff Portal")}
    <div class="p-5 max-w-md mx-auto">
      ${rows || `<div class="text-center text-slate-400 mt-10">No houses set up yet.<br/>Ask your manager to add one.</div>`}
    </div>`;
}

/* ---------- PIN gate (unchanged behaviour: unlock persists on this device) ---------- */
function openHouse(houseId){
  activeHouseId = houseId;
  const house = state.houses.find(h=>h.id===houseId);
  if(house.pin && !houseUnlocked(house.id)){ view="pin"; pinEntry=""; render(); return; }
  openChooser();
}
function renderPin(){
  const house = state.houses.find(h=>h.id===activeHouseId);
  const app = document.getElementById("app");
  app.innerHTML = `${header(house.name)}
    <div class="p-6 max-w-xs mx-auto text-center mt-4">
      ${backBtn("view='home'; render();", "All houses")}
      <div class="text-4xl mb-2">🔒</div>
      <div class="font-semibold mb-4">Enter House PIN</div>
      <div class="flex justify-center gap-2.5 mb-6">${[0,1,2,3].map(i=>`<div class="w-4 h-4 rounded-full border-2 border-indigo-700 ${pinEntry.length>i?"bg-indigo-700":""}"></div>`).join("")}</div>
      <div class="grid grid-cols-3 gap-3">
        ${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?`<div></div>`:`<button onclick="pinPress('${k}')" class="tap bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl py-4 text-xl font-semibold">${k}</button>`).join("")}
      </div>
      <div id="pin-err" class="text-rose-600 text-sm mt-4 hidden">Incorrect PIN</div>
    </div>`;
}
function pinPress(k){
  const house = state.houses.find(h=>h.id===activeHouseId);
  if(k==="⌫"){ pinEntry=pinEntry.slice(0,-1); renderPin(); return; }
  if(pinEntry.length>=4) return;
  pinEntry += String(k);
  if(pinEntry.length===4){
    if(pinEntry===house.pin){ unlockHouse(house.id); openChooser(); }
    else{ document.getElementById("pin-err")?.classList.remove("hidden"); setTimeout(()=>{ pinEntry=""; renderPin(); },500); }
  } else renderPin();
}

/* ---------- Activity chooser — bottom sheet ---------- */
function openChooser(){
  const house = state.houses.find(h=>h.id===activeHouseId);
  document.getElementById("sheet-root").innerHTML = `
  <div class="fixed inset-0 bg-black/50 flex items-end z-50 tap" onclick="if(event.target===this) closeSheet()">
    <div class="bg-white dark:bg-slate-800 rounded-t-3xl w-full p-6 pb-8">
      <div class="w-10 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full mx-auto mb-5"></div>
      <div class="text-center font-bold text-lg mb-5">Choose Activity <span class="block text-sm font-normal text-slate-400 mt-0.5">${esc(house.name)}</span></div>
      <button onclick="closeSheet(); startNightLog();" class="tap w-full flex items-center gap-4 bg-indigo-700 text-white rounded-2xl px-5 py-5 mb-3 active:scale-[0.98] transition-transform">
        <span class="text-3xl">🌙</span><span class="text-lg font-semibold">Night Log</span>
      </button>
      <button onclick="closeSheet(); startSupport();" class="tap w-full flex items-center gap-4 bg-teal-700 text-white rounded-2xl px-5 py-5 active:scale-[0.98] transition-transform">
        <span class="text-3xl">➕</span><span class="text-lg font-semibold">Additional Support</span>
      </button>
    </div>
  </div>`;
}
function closeSheet(){ document.getElementById("sheet-root").innerHTML = ""; }

/* ---------- Night Log — simplified ---------- */
let nightDraft = null;
function startNightLog(){
  nightDraft = { houseId: activeHouseId, date: today(), staffName: localStorage.getItem("ndis-last-staff-name")||"", participantId:"", entries:[] };
  view = "nightlog";
  render();
}
function nightParticipants(){ return state.participants.filter(p=>p.houseId===activeHouseId && p.active!==false); }
function addNightEntry(){
  nightDraft.entries.push({ time: nowTime(), category: nightCategories()[0], notes:"" });
  render();
}
function removeNightEntry(i){ nightDraft.entries.splice(i,1); render(); }
function renderNightLog(){
  const house = state.houses.find(h=>h.id===activeHouseId);
  const parts = nightParticipants();
  const app = document.getElementById("app");
  const entriesHtml = nightDraft.entries.map((e,i)=>`
    <div class="bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl p-4 mb-3">
      <div class="flex gap-3 mb-3">
        <input type="time" value="${e.time}" onchange="nightDraft.entries[${i}].time=this.value" class="${inputCls} w-32" />
        <select onchange="nightDraft.entries[${i}].category=this.value" class="${inputCls} flex-1">
          ${nightCategories().map(c=>`<option ${e.category===c?"selected":""}>${c}</option>`).join("")}
        </select>
      </div>
      <textarea placeholder="Notes (optional)" rows="2" onchange="nightDraft.entries[${i}].notes=this.value" class="${inputCls} text-sm">${esc(e.notes)}</textarea>
      <button onclick="removeNightEntry(${i})" class="tap text-rose-600 text-sm font-medium mt-2">Remove entry</button>
    </div>`).join("");

  app.innerHTML = `${header(house.name+" · Night Log")}
    <div class="p-5 max-w-md mx-auto pb-10">
      ${backBtn("openChooser();","Change activity")}
      ${parts.length===0 ? `
        <div class="bg-amber-50 dark:bg-amber-900/30 border-2 border-amber-200 dark:border-amber-800 rounded-xl p-4 text-sm text-amber-800 dark:text-amber-300">
          No participants are assigned to ${esc(house.name)} yet. Ask your manager to assign one.
        </div>` : `
      ${field("House", `<div class="${inputCls} bg-slate-100 dark:bg-slate-800 text-slate-500">${esc(house.name)}</div>`)}
      ${field("Date", `<input type="date" value="${nightDraft.date}" onchange="nightDraft.date=this.value" class="${inputCls}" />`)}
      ${field("Staff Name", `<input value="${esc(nightDraft.staffName)}" oninput="nightDraft.staffName=this.value" class="${inputCls}" placeholder="Your name" />`)}
      ${field("Participant", `<select onchange="nightDraft.participantId=this.value" class="${inputCls}">
        <option value="">Select participant…</option>
        ${parts.map(p=>`<option value="${p.id}" ${nightDraft.participantId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}
      </select>`)}

      <div class="border-t-2 border-slate-100 dark:border-slate-800 pt-4 mt-2">
        ${entriesHtml}
        <button onclick="addNightEntry()" class="tap w-full border-2 border-dashed border-indigo-300 dark:border-indigo-700 text-indigo-700 dark:text-indigo-400 font-semibold rounded-xl py-4 mb-4">+ Add Entry</button>
      </div>

      <button id="night-submit-btn" onclick="submitNightLog()" class="tap w-full bg-indigo-700 text-white font-bold text-lg rounded-2xl py-4 shadow-lg active:scale-[0.98] transition-transform">Submit Night Log</button>
      `}
    </div>`;
}
async function submitNightLog(){
  if(!nightDraft.staffName.trim()){ alert("Please enter your name."); return; }
  if(!nightDraft.participantId){ alert("Please select a participant."); return; }
  if(nightDraft.entries.length===0){ alert("Add at least one entry before submitting."); return; }
  localStorage.setItem("ndis-last-staff-name", nightDraft.staffName.trim());

  const btn = document.getElementById("night-submit-btn");
  if(btn){ btn.disabled=true; btn.textContent="Saving…"; }

  const interventions = nightDraft.entries.map(e=>({ time:e.time, reason:e.category, support:e.notes, duration:null, returnedToSleep:null }));
  const { error } = await sb.from("night_logs").insert({
    id: uid(), created_at: new Date().toISOString(), house_id: nightDraft.houseId, participant_id: nightDraft.participantId,
    staff_name: nightDraft.staffName.trim(), date: nightDraft.date, shift_start: "", shift_finish: "",
    interventions, total_interventions: interventions.length, total_minutes: 0, overall_night: "", comments: "",
  });
  if(error){
    console.error(error);
    alert("Could not save — check your connection and try again. Nothing was lost.");
    if(btn){ btn.disabled=false; btn.textContent="Submit Night Log"; }
    return;
  }
  successKind = "Night Log";
  view = "success"; render();
}

/* ---------- Additional Support — separate, simplified form ---------- */
let supportDraft = null;
function startSupport(){
  supportDraft = { houseId: activeHouseId, date: today(), staffName: localStorage.getItem("ndis-last-staff-name")||"", participantId:"",
    activityType: supportActivityTypes()[0], startTime:"", endTime:"", km:"", notes:"" };
  view = "support";
  render();
}
function supportDuration(){ return +(minsBetween(supportDraft.startTime, supportDraft.endTime)/60).toFixed(2); }
function renderSupport(){
  const house = state.houses.find(h=>h.id===activeHouseId);
  const parts = nightParticipants();
  const app = document.getElementById("app");
  app.innerHTML = `${header(house.name+" · Additional Support")}
    <div class="p-5 max-w-md mx-auto pb-10">
      ${backBtn("openChooser();","Change activity")}
      ${parts.length===0 ? `
        <div class="bg-amber-50 dark:bg-amber-900/30 border-2 border-amber-200 dark:border-amber-800 rounded-xl p-4 text-sm text-amber-800 dark:text-amber-300">
          No participants are assigned to ${esc(house.name)} yet. Ask your manager to assign one.
        </div>` : `
      ${field("Participant", `<select onchange="supportDraft.participantId=this.value" class="${inputCls}">
        <option value="">Select participant…</option>
        ${parts.map(p=>`<option value="${p.id}" ${supportDraft.participantId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}
      </select>`)}
      ${field("Date", `<input type="date" value="${supportDraft.date}" onchange="supportDraft.date=this.value" class="${inputCls}" />`)}
      ${field("Staff Name", `<input value="${esc(supportDraft.staffName)}" oninput="supportDraft.staffName=this.value" class="${inputCls}" placeholder="Your name" />`)}
      ${field("Activity Type", `<select onchange="supportDraft.activityType=this.value" class="${inputCls}">
        ${supportActivityTypes().map(t=>`<option ${supportDraft.activityType===t?"selected":""}>${t}</option>`).join("")}
      </select>`)}
      <div class="grid grid-cols-2 gap-3">
        ${field("Start Time", `<input type="time" value="${supportDraft.startTime}" onchange="supportDraft.startTime=this.value; render();" class="${inputCls}" />`)}
        ${field("End Time", `<input type="time" value="${supportDraft.endTime}" onchange="supportDraft.endTime=this.value; render();" class="${inputCls}" />`)}
      </div>
      ${field("Duration (auto)", `<div class="${inputCls} bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold">${supportDuration()} hrs</div>`)}
      ${field("Kilometres", `<input type="number" step="0.1" min="0" value="${supportDraft.km}" oninput="supportDraft.km=this.value" class="${inputCls}" placeholder="0" />`)}
      ${field("Notes", `<textarea rows="3" oninput="supportDraft.notes=this.value" class="${inputCls}">${esc(supportDraft.notes)}</textarea>`)}
      <button id="support-submit-btn" onclick="submitSupport()" class="tap w-full bg-teal-700 text-white font-bold text-lg rounded-2xl py-4 shadow-lg active:scale-[0.98] transition-transform mt-2">Submit</button>
      `}
    </div>`;
}
async function submitSupport(){
  if(!supportDraft.staffName.trim()){ alert("Please enter your name."); return; }
  if(!supportDraft.participantId){ alert("Please select a participant."); return; }
  if(!supportDraft.startTime || !supportDraft.endTime){ alert("Please enter start and end time."); return; }
  localStorage.setItem("ndis-last-staff-name", supportDraft.staffName.trim());

  const btn = document.getElementById("support-submit-btn");
  if(btn){ btn.disabled=true; btn.textContent="Saving…"; }

  const { error } = await sb.from("additional_support_logs").insert({
    id: uid(), created_at: new Date().toISOString(), house_id: supportDraft.houseId, participant_id: supportDraft.participantId,
    staff_name: supportDraft.staffName.trim(), date: supportDraft.date, support_type: supportDraft.activityType,
    start_time: supportDraft.startTime, finish_time: supportDraft.endTime, total_hours: supportDuration(),
    km: Number(supportDraft.km)||0, destination: "", notes: supportDraft.notes,
  });
  if(error){
    console.error(error);
    alert("Could not save — check your connection and try again. Nothing was lost.");
    if(btn){ btn.disabled=false; btn.textContent="Submit"; }
    return;
  }
  successKind = "Additional Support";
  view = "success"; render();
}

/* ---------- Success ---------- */
function renderSuccess(){
  const house = state.houses.find(h=>h.id===activeHouseId);
  document.getElementById("app").innerHTML = `${header(house?house.name:"")}
    <div class="p-6 max-w-sm mx-auto text-center mt-10">
      <div class="text-6xl mb-4">✅</div>
      <div class="font-bold text-xl font-display mb-1">${esc(successKind)} submitted</div>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-8">You can close this, or submit another entry.</p>
      <button onclick="openChooser();" class="tap w-full bg-indigo-700 text-white font-semibold rounded-2xl py-4 mb-3">Submit another for ${esc(house?house.name:"this house")}</button>
      <button onclick="activeHouseId=null; view='home'; render();" class="tap w-full bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 font-semibold rounded-2xl py-4">All houses</button>
    </div>`;
}

boot();
</script>
</body>
</html>
