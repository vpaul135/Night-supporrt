function loadKey(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function saveKey(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ console.error("storage error", e); } }
function uid(){ return "id-"+Date.now()+"-"+Math.random().toString(16).slice(2); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return todayStr(); }
function fmtDate(s){ if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; }
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function houseSlug(house){ return house.name.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
function minutesBetween(start, finish){
  if(!start || !finish) return 0;
  const [sh,sm] = start.split(":").map(Number), [fh,fm] = finish.split(":").map(Number);
  let mins = (fh*60+fm) - (sh*60+sm);
  if(mins < 0) mins += 24*60; // overnight/crosses midnight
  return mins;
}

function mapNightLogRow(r){

    staffName:r.staff_name, shiftStart:r.shift_start, shiftFinish:r.shift_finish,

function mapAdditionalSupportRow(r){

    staffName:r.staff_name, supportType:r.support_type, startTime:r.start_time, finishTime:r.finish_time,

function participantName(id){ return state.participants.find(p=>p.id===id)?.name || "Unknown"; }
function houseName(id){ return state.houses.find(h=>h.id===id)?.name || "—"; }
function activeInterventionTypes(){ return state.interventionTypes.filter(t=>t.active!==false).sort((a,b)=>a.sortOrder-b.sortOrder); }
function activeSupportTypes(){ return state.supportTypes.filter(t=>t.active!==false).sort((a,b)=>a.sortOrder-b.sortOrder); }

/* ---------- 5. Cloud boot + realtime ---------- */
let realtimeChannel = null;
async function bootCloudData(){
  try{
    const [housesRes, staffRes, partsRes, logsRes, intRes, supRes, addRes] = await Promise.all([
      sb.from("houses").select("*"),
      sb.from("staff").select("*"),
      sb.from("participants").select("*"),
      sb.from("night_logs").select("*").order("created_at", { ascending:true }),
      sb.from("intervention_types").select("*"),
      sb.from("support_types").select("*"),
      sb.from("additional_support_logs").select("*").order("created_at", { ascending:true }),
    ]);
    if(housesRes.error) throw housesRes.error;
    if(intRes.error) throw intRes.error;
    state.houses = (housesRes.data||[]).map(h=>({ id:h.id, name:h.name, pin:h.pin||"", active:h.active!==false }));
    state.staff = (staffRes.data||[]).map(s=>({ id:s.id, name:s.name, active:s.active!==false }));
    state.participants = (partsRes.data||[]).map(p=>({ id:p.id, name:p.name, houseId:p.house_id, active:p.active!==false }));
    state.nightLogs = (logsRes.data||[]).map(mapNightLogRow);
    state.additionalSupportLogs = (addRes.data||[]).map(mapAdditionalSupportRow);
    state.interventionTypes = (intRes.data||[]).map(t=>({ id:t.id, label:t.label, icon:t.icon||"", sortOrder:t.sort_order||0, active:t.active!==false }));
    state.supportTypes = (supRes.data||[]).map(t=>({ id:t.id, label:t.label, sortOrder:t.sort_order||0, active:t.active!==false }));
    state.cloudReady = true;
  }catch(e){
    console.error("Supabase load failed", e);
    state.cloudError = e.message || "Could not reach the cloud database.";
  }
  routeRender();
  subscribeRealtime();
}
function subscribeRealtime(){
  if(realtimeChannel) return;
  const refetch = (table, mapFn, stateKey) => {
    sb.from(table).select("*").then(({data})=>{ if(data){ state[stateKey] = data.map(mapFn); routeRender(); } });
  };
  realtimeChannel = sb.channel("night-support-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"night_logs" }, payload=>{
      if(payload.eventType === "INSERT"){ if(!state.nightLogs.some(l=>l.id===payload.new.id)) state.nightLogs.push(mapNightLogRow(payload.new)); }
      else if(payload.eventType === "UPDATE"){ state.nightLogs = state.nightLogs.map(l=>l.id===payload.new.id ? mapNightLogRow(payload.new) : l); }
      else if(payload.eventType === "DELETE"){ state.nightLogs = state.nightLogs.filter(l=>l.id!==payload.old.id); }
      routeRender();
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"additional_support_logs" }, payload=>{
      if(payload.eventType === "INSERT"){ if(!state.additionalSupportLogs.some(l=>l.id===payload.new.id)) state.additionalSupportLogs.push(mapAdditionalSupportRow(payload.new)); }
      else if(payload.eventType === "UPDATE"){ state.additionalSupportLogs = state.additionalSupportLogs.map(l=>l.id===payload.new.id ? mapAdditionalSupportRow(payload.new) : l); }
      else if(payload.eventType === "DELETE"){ state.additionalSupportLogs = state.additionalSupportLogs.filter(l=>l.id!==payload.old.id); }
      routeRender();
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"houses" }, ()=>refetch("houses", h=>({id:h.id,name:h.name,pin:h.pin||"",active:h.active!==false}), "houses"))
    .on("postgres_changes", { event:"*", schema:"public", table:"participants" }, ()=>refetch("participants", p=>({id:p.id,name:p.name,houseId:p.house_id,active:p.active!==false}), "participants"))
    .on("postgres_changes", { event:"*", schema:"public", table:"staff" }, ()=>refetch("staff", s=>({id:s.id,name:s.name,active:s.active!==false}), "staff"))
    .on("postgres_changes", { event:"*", schema:"public", table:"intervention_types" }, ()=>refetch("intervention_types", t=>({id:t.id,label:t.label,icon:t.icon||"",sortOrder:t.sort_order||0,active:t.active!==false}), "interventionTypes"))
    .on("postgres_changes", { event:"*", schema:"public", table:"support_types" }, ()=>refetch("support_types", t=>({id:t.id,label:t.label,sortOrder:t.sort_order||0,active:t.active!==false}), "supportTypes"))
    .subscribe();
}

  if(clean) localStorage.setItem("ndis-night-admin-pin", clean); else localStorage.removeItem("ndis-night-admin-pin");

}

/* ---------- 9. Night Support analytics ---------- */
function isHighSupportNight(l){ return l.totalInterventions > NIGHT_ALERT_INTERVENTIONS || l.totalMinutes > NIGHT_ALERT_MINUTES; }
function filteredNightLogs(){
  const f = state.adminFilter;
  let rows = state.nightLogs;
  if(f.participant!=="all") rows = rows.filter(l=>l.participantId===f.participant);
  if(f.house!=="all") rows = rows.filter(l=>l.houseId===f.house);
  if(f.staff.trim()) rows = rows.filter(l=>(l.staffName||"").toLowerCase().includes(f.staff.trim().toLowerCase()));
  if(f.from) rows = rows.filter(l=>l.date>=f.from);
  if(f.to) rows = rows.filter(l=>l.date<=f.to);
  return rows.slice().sort((a,b)=> a.date<b.date?1:-1);
}
function computeNightAnalytics(rows){
  const nights = rows.length || 1;
  const totalInterventions = rows.reduce((s,l)=>s+l.totalInterventions,0);
  const totalMinutes = rows.reduce((s,l)=>s+l.totalMinutes,0);
  const reasonCounts = {};
  rows.forEach(l=> (l.interventions||[]).forEach(iv=>{ reasonCounts[iv.reason] = (reasonCounts[iv.reason]||0)+1; }));
  const topReason = Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1])[0]?.[0] || "";
  const avgByReason = {};
  activeInterventionTypes().forEach(r=> avgByReason[r.label] = rows.length ? +((reasonCounts[r.label]||0)/rows.length).toFixed(1) : 0);
  const staffSet = new Set(rows.map(l=>l.staffName).filter(Boolean));
  let highestNight = null;
  rows.forEach(l=>{ if(!highestNight || l.totalMinutes>highestNight.totalMinutes) highestNight = l; });
  return { avgInterventions: rows.length ? +(totalInterventions/nights).toFixed(1) : 0, avgMinutes: rows.length ? +(totalMinutes/nights).toFixed(0) : 0,
    topReason, avgByReason, totalInterventions, totalMinutes, nights: rows.length, staffList: [...staffSet], highestNight };
}
function periodTotals(days){
  const to = today();
  const fromD = new Date(); fromD.setDate(fromD.getDate()-days);
  const from = fromD.getFullYear()+"-"+String(fromD.getMonth()+1).padStart(2,"0")+"-"+String(fromD.getDate()).padStart(2,"0");
  const rows = state.nightLogs.filter(l=>l.date>=from && l.date<=to);
  return { interventions: rows.reduce((s,l)=>s+l.totalInterventions,0), minutes: rows.reduce((s,l)=>s+l.totalMinutes,0), nights: rows.length };
}
function renderNightTrendChart(rows){
  const recent = rows.slice(0,14).slice().reverse();
  if(recent.length===0) return "";
  const max = Math.max(...recent.map(r=>r.totalMinutes), 30);
  const w=700,h=140,barW=w/recent.length;
  const bars = recent.map((r,i)=>{
    const barH=(r.totalMinutes/max)*(h-24), x=i*barW+barW*0.15, bw=barW*0.7;
    const color = isHighSupportNight(r) ? "#e11d48" : "#4338ca";
    return `<rect x="${x}" y="${h-barH-18}" width="${bw}" height="${barH}" fill="${color}" rx="2"></rect><text x="${x+bw/2}" y="${h-4}" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.6">${r.date.slice(5)}</text>`;
  }).join("");
  return `<div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-4 mb-4">
    <div class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2">Trend — total support minutes per night (last ${recent.length} nights)</div>
    <svg viewBox="0 0 ${w} ${h}" class="w-full h-36 text-slate-500 dark:text-slate-400">${bars}</svg></div>`;
}
function setAdminFilter(patch){ Object.assign(state.adminFilter, patch); setAdminSection(state.adminSection); }
function setNightQuickRange(days){
  const to = today();
  const fromD = new Date(); fromD.setDate(fromD.getDate()-days);
  const from = fromD.getFullYear()+"-"+String(fromD.getMonth()+1).padStart(2,"0")+"-"+String(fromD.getDate()).padStart(2,"0");
  setAdminFilter({from, to});
}
function exportNightExcel(){
  const rows = filteredNightLogs();
  const data = [];
  rows.forEach(l=>{
    (l.interventions&&l.interventions.length ? l.interventions : [null]).forEach(iv=>{
      data.push({ Date:l.date, Participant:participantName(l.participantId), House:houseName(l.houseId), Staff:l.staffName||"",
        "Shift Start":l.shiftStart||"", "Shift Finish":l.shiftFinish||"",
        "Intervention Time":iv?.time||"", "Intervention Reason":iv?.reason||"", "Support Provided":iv?.support||"",
        "Duration (min)":iv?.duration ?? "", "Returned to Sleep":iv ? (iv.returnedToSleep?"Yes":"No") : "",
        "Total Interventions (night)":l.totalInterventions, "Total Minutes (night)":l.totalMinutes,
        "Overall Night":l.overallNight, "High Support Alert":isHighSupportNight(l)?"Yes":"No", Comments:l.comments||"" });
    });
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Night Support");
  const f = state.adminFilter;
  XLSX.writeFile(wb, `night-support-${f.from||"all"}-to-${f.to||"all"}.xlsx`);
}

async function saveEditedNightLog(){

function filteredAdditionalSupport(){
  const f = state.adminFilter;
  let rows = state.additionalSupportLogs;
  if(f.participant!=="all") rows = rows.filter(l=>l.participantId===f.participant);
  if(f.house!=="all") rows = rows.filter(l=>l.houseId===f.house);
  if(f.staff.trim()) rows = rows.filter(l=>(l.staffName||"").toLowerCase().includes(f.staff.trim().toLowerCase()));
  if(f.from) rows = rows.filter(l=>l.date>=f.from);
  if(f.to) rows = rows.filter(l=>l.date<=f.to);
  return rows.slice().sort((a,b)=> a.date<b.date?1:-1);
}
function additionalSupportTotals(rows){
  return { hours: +rows.reduce((s,l)=>s+l.totalHours,0).toFixed(1), km: +rows.reduce((s,l)=>s+l.km,0).toFixed(1), sessions: rows.length };

function dailyBreakdownRows(rows){
  const byDate = {};
  rows.forEach(l=>{
    if(!byDate[l.date]) byDate[l.date] = { date:l.date, staff:new Set(), interventions:0, minutes:0, ratings:[], reasons:{} };
    const d = byDate[l.date];
    d.staff.add(l.staffName||"—"); d.interventions += l.totalInterventions; d.minutes += l.totalMinutes;
    if(l.overallNight) d.ratings.push(l.overallNight);
    (l.interventions||[]).forEach(iv=>{ d.reasons[iv.reason] = (d.reasons[iv.reason]||0)+1; });
  });
  return Object.values(byDate).sort((a,b)=> a.date<b.date?1:-1).map(d=>({
    ...d, staff:[...d.staff].join(", "),
    mainReasons: Object.entries(d.reasons).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([r])=>r).join(", ") || "—",
    rating: d.ratings.sort((a,b)=>NIGHT_RATINGS.indexOf(b)-NIGHT_RATINGS.indexOf(a))[0] || "—",
  }));
}

  const f = state.adminFilter;

  if(f.reportType==="night" || f.reportType==="combined"){
    const nRows = filteredNightLogs(); const data=[];
    nRows.forEach(l=>{ (l.interventions&&l.interventions.length?l.interventions:[null]).forEach(iv=>{
      data.push({ Date:l.date, Participant:participantName(l.participantId), House:houseName(l.houseId), Staff:l.staffName||"",
        "Intervention Reason":iv?.reason||"", "Duration (min)":iv?.duration??"", "Total Minutes (night)":l.totalMinutes, "Overall Night":l.overallNight, Comments:l.comments||"" }); }); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Night Support");
  }
  if(f.reportType==="additional" || f.reportType==="combined"){
    const aRows = filteredAdditionalSupport();
    const data = aRows.map(l=>({ Date:l.date, Participant:participantName(l.participantId), Staff:l.staffName||"", Purpose:l.supportType||"",
      "Total Hours":l.totalHours, Kilometres:l.km, Destination:l.destination||"", Notes:l.notes||"" }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Additional Support");
  }
  XLSX.writeFile(wb, `${reportTitle().replace(/[^a-z0-9]+/gi,"-")}.xlsx`);
}

          <button onclick="exportCombinedExcel()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-1.5"><i data-lucide="download" class="w-4 h-4"></i>Export to Excel</button>
          <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-1.5"><i data-lucide="printer" class="w-4 h-4"></i>Export to PDF</button>
        </div>
      </div>

      ${showNight ? `

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          ${statCard("Total Nights", distinctNights, "calendar-days", "teal")}
          ${statCard("Total Interventions", analytics.totalInterventions, "activity", "indigo")}
          ${statCard("Total Support Minutes", analytics.totalMinutes, "clock", "amber")}
          ${statCard("Avg Minutes/Night", analytics.avgMinutes, "trending-up", "slate")}

          <div class="bg-slate-50 dark:bg-slate-900 rounded-lg px-3 py-2 sm:col-span-2"><span class="text-slate-500">Staff Members:</span> <strong>${esc(analytics.staffList.join(", ")||"—")}</strong></div>

              <td class="px-3 py-2 whitespace-nowrap">${fmtDate(l.date)}</td><td class="px-3 py-2">${esc(l.startTime||"—")}</td><td class="px-3 py-2">${esc(l.finishTime||"—")}</td>
              <td class="px-3 py-2">${l.totalHours}h</td><td class="px-3 py-2">${l.km} km</td><td class="px-3 py-2">${esc(l.destination||"—")}</td><td class="px-3 py-2">${esc(l.supportType||"—")}</td><td class="px-3 py-2">${esc(l.staffName||"—")}</td>
            </tr>`).join("") || `<tr><td colspan="8" class="text-center text-slate-400 py-6">No records for this period.</td></tr>`}</tbody>
          </table>

  lucide.createIcons();
