function loadKey(key, fallback){

function uid(){ return "id-"+Date.now()+"-"+Math.random().toString(16).slice(2); }

function today(){ return todayStr(); }
function fmtDate(s){ if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; }
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function houseSlug(house){ return house.name.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }

let state = {
  participants: [],   // read-only here — managed in Roster of Care app, synced from Supabase
  houses: [],          // read-only here — managed in Roster of Care app, synced from Supabase
  staff: [],            // read-only here — managed in Roster of Care app, synced from Supabase
  nightLogs: [],       // owned by this app, lives in Supabase, streams live
  adminFilter: { participant:"all", house:"all", staff:"", from:"", to:"" },
  adminTab: "dashboard", // 'dashboard' | 'evidence'
  evidenceComments: "",
  cloudReady: false,
  cloudError: null,
};

function mapNightLogRow(r){
  return {
    id: r.id, createdAt: r.created_at, participantId: r.participant_id, houseId: r.house_id, date: r.date,
    staffName: r.staff_name, shiftStart: r.shift_start, shiftFinish: r.shift_finish,
    interventions: r.interventions || [], totalInterventions: r.total_interventions, totalMinutes: r.total_minutes,
    overallNight: r.overall_night, comments: r.comments,
  };
}
async function saveNightLogs(){ /* no-op: night_logs are written directly to Supabase in submitNightLog() */ }
function participantName(id){ return state.participants.find(p=>p.id===id)?.name || "Unknown"; }
function houseName(id){ return state.houses.find(h=>h.id===id)?.name || "—"; }

let realtimeChannel = null;
async function bootCloudData(){
  try{
    const [housesRes, staffRes, partsRes, logsRes] = await Promise.all([
      sb.from("houses").select("*"),
      sb.from("staff").select("*"),
      sb.from("participants").select("*"),
      sb.from("night_logs").select("*").order("created_at", { ascending:true }),
    ]);
    if(housesRes.error) throw housesRes.error;
    state.houses = (housesRes.data||[]).map(h=>({ id:h.id, name:h.name, pin:h.pin||"" }));
    state.staff = (staffRes.data||[]).map(s=>({ id:s.id, name:s.name }));
    state.participants = (partsRes.data||[]).map(p=>({ id:p.id, name:p.name, houseId:p.house_id, active:p.active }));
    state.nightLogs = (logsRes.data||[]).map(mapNightLogRow);
    state.cloudReady = true;
  }catch(e){
    console.error("Supabase load failed", e);
    state.cloudError = e.message || "Could not reach the cloud database.";
  }
  routeRender();
  subscribeRealtime();
}
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel("night-support-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"night_logs" }, payload=>{
      if(payload.eventType === "INSERT"){
        if(!state.nightLogs.some(l=>l.id===payload.new.id)) state.nightLogs.push(mapNightLogRow(payload.new));
      } else if(payload.eventType === "UPDATE"){
        state.nightLogs = state.nightLogs.map(l=>l.id===payload.new.id ? mapNightLogRow(payload.new) : l);
      } else if(payload.eventType === "DELETE"){
        state.nightLogs = state.nightLogs.filter(l=>l.id!==payload.old.id);
      }
      routeRender();
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"houses" }, ()=>{
      sb.from("houses").select("*").then(({data})=>{ if(data){ state.houses = data.map(h=>({id:h.id,name:h.name,pin:h.pin||""})); routeRender(); } });
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"participants" }, ()=>{
      sb.from("participants").select("*").then(({data})=>{ if(data){ state.participants = data.map(p=>({id:p.id,name:p.name,houseId:p.house_id,active:p.active})); routeRender(); } });
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"staff" }, ()=>{
      sb.from("staff").select("*").then(({data})=>{ if(data){ state.staff = data.map(s=>({id:s.id,name:s.name})); routeRender(); } });
    })
    .subscribe();
}

function initDarkMode(){
  const saved = localStorage.getItem("ndis-theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  if(saved === "dark" || (!saved && prefersDark)) document.documentElement.classList.add("dark");
}
function toggleDarkMode(){
  const isDark = document.documentElement.classList.toggle("dark");
  localStorage.setItem("ndis-theme", isDark ? "dark" : "light");
  routeRender();
}
initDarkMode();

/* ---------------------------------------------------------
   Routing — decides what to show:
   - /night-support/<slug> or ?house=<slug>   -> staff submission form
   - /night-support/admin  or ?admin=1        -> manager dashboard
   - nothing                                   -> house directory (read-only)
--------------------------------------------------------- */
function routeRender(){
  if(state.cloudError){
    document.getElementById("app").innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-sm text-center">
          <i data-lucide="cloud-off" class="w-10 h-10 text-rose-500 mx-auto mb-3"></i>
          <div class="font-semibold text-slate-700 dark:text-slate-200 mb-1">Can't reach the cloud database</div>
          <p class="text-sm text-slate-500 dark:text-slate-400">${esc(state.cloudError)}</p>
          <button onclick="location.reload()" class="mt-4 bg-indigo-700 hover:bg-indigo-800 text-white text-sm px-4 py-2 rounded-lg">Try again</button>
        </div>
      </div>`;
    lucide.createIcons();
    return;
  }
  renderAdminGate();
}

function renderAdminGate(){
  const savedPin = localStorage.getItem("ndis-night-admin-pin") || "";
  const unlocked = sessionStorage.getItem("ndis-night-admin-unlocked") === "1";
  if(savedPin && !unlocked){ renderAdminPinPad(); return; }
  renderAdminDashboard();
}
let adminPinEntry = "";
function renderAdminPinPad(){
  const app = document.getElementById("app");
  app.innerHTML = `
    ${brandHeader("Manager dashboard")}
    <div class="p-6 max-w-xs mx-auto text-center">
      <i data-lucide="shield" class="w-8 h-8 mx-auto text-indigo-700 dark:text-indigo-400 mb-2"></i>
      <div class="font-semibold mb-3">Enter Manager PIN</div>
      <div class="flex justify-center gap-2 mb-4">${[0,1,2,3].map(i=>`<div class="w-3.5 h-3.5 rounded-full border-2 border-indigo-700 ${adminPinEntry.length>i?"bg-indigo-700":""}"></div>`).join("")}</div>
      <div class="grid grid-cols-3 gap-2">
        ${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?`<div></div>`:`<button onclick="adminPinPress('${k}')" class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg py-3.5 text-lg font-semibold">${k}</button>`).join("")}
      </div>
      <div id="admin-pin-error" class="text-rose-600 text-xs mt-3 hidden">Incorrect PIN — try again.</div>
    </div>`;
  lucide.createIcons();
}
function adminPinPress(k){
  const savedPin = localStorage.getItem("ndis-night-admin-pin") || "";
  if(k==="⌫"){ adminPinEntry = adminPinEntry.slice(0,-1); renderAdminPinPad(); return; }
  if(adminPinEntry.length>=4) return;
  adminPinEntry += String(k);
  if(adminPinEntry.length===4){
    if(adminPinEntry===savedPin){ sessionStorage.setItem("ndis-night-admin-unlocked","1"); adminPinEntry=""; renderAdminDashboard(); }
    else{ document.getElementById("admin-pin-error")?.classList.remove("hidden"); setTimeout(()=>{ adminPinEntry=""; renderAdminPinPad(); }, 500); }
  } else renderAdminPinPad();
}
function setAdminPin(){
  const current = localStorage.getItem("ndis-night-admin-pin") || "";
  const next = prompt(current ? "Enter a new 4-digit PIN (blank to remove PIN protection):" : "Set a 4-digit PIN to protect this dashboard (blank = no PIN):", "");
  if(next===null) return;
  const clean = next.replace(/\D/g,"").slice(0,4);
  if(clean) localStorage.setItem("ndis-night-admin-pin", clean); else localStorage.removeItem("ndis-night-admin-pin");
  sessionStorage.removeItem("ndis-night-admin-unlocked");
  renderAdminGate();
}

function isHighSupportNight(l){ return l.totalInterventions > NIGHT_ALERT_INTERVENTIONS || l.totalMinutes > NIGHT_ALERT_MINUTES; }
function filteredNightLogs(){
  const f = state.adminFilter;
  let rows = state.nightLogs;
  if(f.participant!=="all") rows = rows.filter(l=>l.participantId===f.participant);
  if(f.house!=="all") rows = rows.filter(l=>l.houseId===f.house);
  if(f.staff.trim()) rows = rows.filter(l=>(l.staffName||"").toLowerCase().includes(f.staff.trim().toLowerCase()));
  if(f.from) rows = rows.filter(l=>l.date>=f.from);
  if(f.to) rows = rows.filter(l=>l.date<=f.to);
  return rows.slice().sort((a,b)=> a.date<b.date?1:-1);
}
function computeNightAnalytics(rows){
  const nights = rows.length || 1;
  const totalInterventions = rows.reduce((s,l)=>s+l.totalInterventions,0);
  const totalMinutes = rows.reduce((s,l)=>s+l.totalMinutes,0);
  const reasonCounts = {};
  rows.forEach(l=> (l.interventions||[]).forEach(iv=>{ reasonCounts[iv.reason] = (reasonCounts[iv.reason]||0)+1; }));
  const topReason = Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1])[0]?.[0] || "";
  const avgByReason = {};
  NIGHT_REASONS.forEach(r=> avgByReason[r.value] = rows.length ? +((reasonCounts[r.value]||0)/rows.length).toFixed(1) : 0);
  return { avgInterventions: rows.length ? +(totalInterventions/nights).toFixed(1) : 0, avgMinutes: rows.length ? +(totalMinutes/nights).toFixed(0) : 0, topReason, avgByReason, totalInterventions, totalMinutes, nights: rows.length };
}
function renderNightTrendChart(rows){
  const recent = rows.slice(0,14).slice().reverse();
  if(recent.length===0) return "";
  const max = Math.max(...recent.map(r=>r.totalMinutes), 30);
  const w=700,h=140,barW=w/recent.length;
  const bars = recent.map((r,i)=>{
    const barH=(r.totalMinutes/max)*(h-24), x=i*barW+barW*0.15, bw=barW*0.7;
    const color = isHighSupportNight(r) ? "#e11d48" : "#4338ca";
    return `<rect x="${x}" y="${h-barH-18}" width="${bw}" height="${barH}" fill="${color}" rx="2"></rect><text x="${x+bw/2}" y="${h-4}" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.6">${r.date.slice(5)}</text>`;
  }).join("");
  return `<div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-4 mb-4">
    <div class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2">Trend — total support minutes per night (last ${recent.length} nights)</div>
    <svg viewBox="0 0 ${w} ${h}" class="w-full h-36 text-slate-500 dark:text-slate-400">${bars}</svg></div>`;
}
function setAdminFilter(patch){ Object.assign(state.adminFilter, patch); renderAdminDashboard(); }
function setNightQuickRange(days){
  const to = today();
  const fromD = new Date(); fromD.setDate(fromD.getDate()-days);
  const from = fromD.getFullYear()+"-"+String(fromD.getMonth()+1).padStart(2,"0")+"-"+String(fromD.getDate()).padStart(2,"0");
  setAdminFilter({from, to});
}
function exportNightExcel(){
  const rows = filteredNightLogs();
  const data = [];
  rows.forEach(l=>{
    (l.interventions&&l.interventions.length ? l.interventions : [null]).forEach(iv=>{
      data.push({
        Date: l.date, Participant: participantName(l.participantId), House: houseName(l.houseId), Staff: l.staffName||"",
        "Shift Start": l.shiftStart||"", "Shift Finish": l.shiftFinish||"",
        "Intervention Time": iv?.time||"", "Intervention Reason": iv?.reason||"", "Support Provided": iv?.support||"",
        "Duration (min)": iv?.duration ?? "", "Returned to Sleep": iv ? (iv.returnedToSleep?"Yes":"No") : "",
        "Total Interventions (night)": l.totalInterventions, "Total Minutes (night)": l.totalMinutes,
        "Overall Night": l.overallNight, "High Support Alert": isHighSupportNight(l)?"Yes":"No", Comments: l.comments||"",
      });
    });
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Night Support");
  const f = state.adminFilter;
  XLSX.writeFile(wb, `night-support-${f.from||"all"}-to-${f.to||"all"}.xlsx`);
}

}

function renderNightEvidence(){
  state.adminTab = "evidence";
  const app = document.getElementById("app");
  const f = state.adminFilter;
  const rows = filteredNightLogs();
  const analytics = computeNightAnalytics(rows);
  const distinctNights = new Set(rows.map(r=>r.date)).size;

  app.innerHTML = `
    ${brandHeader("Funding evidence report")}
    <div class="p-4 max-w-4xl mx-auto">
      <button onclick="renderAdminDashboard()" class="text-sm text-slate-500 hover:text-indigo-700 flex items-center gap-1 mb-3 print-hidden"><i data-lucide="arrow-left" class="w-4 h-4"></i>Back to dashboard</button>
      <h1 class="text-xl font-bold mb-1 font-display">NDIS Funding Evidence Report</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Suitable for Support Coordinators, OT, Allied Health and plan reassessments.</p>

      <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-4 mb-4 print-hidden">
        <div class="grid sm:grid-cols-3 gap-3">
          ${field("Participant", `<select onchange="setAdminFilter({participant:this.value}); renderNightEvidence();" class="${inputCls}">
            <option value="all" ${f.participant==="all"?"selected":""}>All participants</option>
            ${state.participants.map(p=>`<option value="${p.id}" ${f.participant===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}
          </select>`)}
          ${field("From", `<input type="date" class="${inputCls}" value="${f.from}" onchange="setAdminFilter({from:this.value}); renderNightEvidence();" />`)}
          ${field("To", `<input type="date" class="${inputCls}" value="${f.to}" onchange="setAdminFilter({to:this.value}); renderNightEvidence();" />`)}
        </div>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 mb-4">
        <div class="font-display font-bold text-lg mb-1">${f.participant==="all" ? "All Participants" : esc(participantName(f.participant))}</div>
        <div class="text-xs text-slate-500 dark:text-slate-400 mb-4">${f.from?fmtDate(f.from):"Start"} – ${f.to?fmtDate(f.to):"Today"}</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          ${statCard("Total Nights", distinctNights, "calendar-days", "teal")}
          ${statCard("Total Interventions", analytics.totalInterventions, "activity", "indigo")}
          ${statCard("Avg Interventions/Night", analytics.avgInterventions, "trending-up", "amber")}
          ${statCard("Total Staff Support Time", Math.round(analytics.totalMinutes/60*10)/10+"h", "clock", "slate")}
        </div>
        <div class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1">Clinical Summary</div>
        <p class="text-sm text-slate-600 dark:text-slate-300 mb-4">
          Across ${distinctNights} recorded night${distinctNights!==1?"s":""}, an average of ${analytics.avgInterventions} staff intervention${analytics.avgInterventions===1?"":"s"} were required per night, totalling ${analytics.totalMinutes} minutes of direct overnight support (${Math.round(analytics.totalMinutes/60*10)/10} hours).
          The most frequent intervention type was <strong>${analytics.topReason||"—"}</strong>.
          ${rows.filter(isHighSupportNight).length ? `${rows.filter(isHighSupportNight).length} night(s) exceeded the high-support threshold (>${NIGHT_ALERT_INTERVENTIONS} interventions or ${NIGHT_ALERT_MINUTES}+ minutes), indicating a consistent pattern of elevated overnight support need.` : `No nights exceeded the high-support alert threshold in this period.`}
        </p>
        <div class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1">Manager Comments</div>
        <textarea rows="3" class="${inputCls} print-hidden" placeholder="Add clinical/contextual notes for the funding review..." oninput="state.evidenceComments=this.value">${esc(state.evidenceComments)}</textarea>
        <p class="hidden print:block text-sm text-slate-600">${esc(state.evidenceComments)}</p>
      </div>

      <div class="flex gap-2 print-hidden">
        <button onclick="exportNightExcel()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-1.5"><i data-lucide="download" class="w-4 h-4"></i>Export to Excel</button>
        <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-1.5"><i data-lucide="printer" class="w-4 h-4"></i>Export to PDF</button>
      </div>
    </div>`;
  lucide.createIcons();
}


initDarkMode();
document.getElementById("app").innerHTML = `<div class="min-h-screen flex items-center justify-center text-slate-400 text-sm">Loading…</div>`;
bootCloudData();
</script>
</body>
</html>
