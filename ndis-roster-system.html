function normalizeRosters(raw){
  if(!raw) return null;
  const firstVal = Object.values(raw)[0];
  if(firstVal !== undefined && !Array.isArray(firstVal)) return null; // legacy (old day-tag) format — reseed
  return raw;
}

/* ---------------------------------------------------------
   Storage (localStorage — used for rosters/logs, kept local.
   Houses/participants/staff now live in Supabase — see below —
   so the same data reaches the Night Support Monitoring app
   on any device, not just this browser.)
--------------------------------------------------------- */
function loadKey(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveKey(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ console.error("storage error", e); }
}
function uid(){ return "id-"+Date.now()+"-"+Math.random().toString(16).slice(2); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(s){ if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; }
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------------------------------------------------
   Cloud sync — Supabase (houses / staff / participants).
   Rosters and service logs stay on this device (localStorage);
   only the data the Night Support app needs to share across
   phones lives in the cloud.
--------------------------------------------------------- */
const SUPABASE_URL = "https://lxcfabnjphnqgjvzghjm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_TTQkbq7bgCQM6QLzT2W81Q_HSgAgAoY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let cloudSyncStatus = "loading"; // 'loading' | 'ready' | 'error'
let cloudSyncError = null;

async function bootCloudData(){
  try{
    const [housesRes, staffRes, partsRes] = await Promise.all([
      sb.from("houses").select("*"),
      sb.from("staff").select("*"),
      sb.from("participants").select("*"),
    ]);
    if(housesRes.error) throw housesRes.error;
    if(staffRes.error) throw staffRes.error;
    if(partsRes.error) throw partsRes.error;

    // Merge local data into Supabase every boot (not just when a table is fully
    // empty): any house/staff/participant that exists on this device but not yet
    // in the cloud gets pushed up via upsert. This is what actually fixes a
    // participant "reverting" to Unassigned — previously a participant that was
    // never migrated would silently fail every .update() (0 rows matched, no
    // error) because the row didn't exist in Supabase at all.
    const cloudHouseIds = new Set(housesRes.data.map(h=>h.id));
    const missingHouses = state.houses.filter(h=>!cloudHouseIds.has(h.id));
    if(missingHouses.length){
      await sb.from("houses").upsert(missingHouses.map(h=>({ id:h.id, name:h.name, pin:h.pin||"" })));
    }
    const cloudStaffIds = new Set(staffRes.data.map(s=>s.id));
    const missingStaff = state.staff.filter(s=>!cloudStaffIds.has(s.id));
    if(missingStaff.length){
      await sb.from("staff").upsert(missingStaff.map(s=>({ id:s.id, name:s.name })));
    }
    const cloudPartIds = new Set(partsRes.data.map(p=>p.id));
    const missingParts = state.participants.filter(p=>!cloudPartIds.has(p.id));
    if(missingParts.length){
      await sb.from("participants").upsert(missingParts.map(p=>({ id:p.id, name:p.name, house_id:p.houseId||null, active:p.active })));
    }

    // Re-fetch so state reflects exactly what's in Supabase now (including the
    // rows we just upserted above).
    const [housesFinal, staffFinal, partsFinal] = await Promise.all([
      missingHouses.length ? sb.from("houses").select("*") : housesRes,
      missingStaff.length ? sb.from("staff").select("*") : staffRes,
      missingParts.length ? sb.from("participants").select("*") : partsRes,
    ]);
    state.houses = (housesFinal.data||[]).map(h=>({ id:h.id, name:h.name, pin:h.pin||"" }));
    state.staff = (staffFinal.data||[]).map(s=>({ id:s.id, name:s.name }));
    state.participants = (partsFinal.data||[]).map(p=>({ id:p.id, name:p.name, houseId:p.house_id, active:p.active }));

    saveKey("ndis-houses", state.houses);
    saveKey("ndis-staff", state.staff);
    saveKey("ndis-participants", state.participants);
    cloudSyncStatus = "ready";
  }catch(e){
    console.error("Supabase load failed", e);
    cloudSyncStatus = "error";
    cloudSyncError = e.message || "Could not reach the cloud database.";
  }
  render();
  subscribeCloudRealtime();
}
let cloudChannel = null;
function subscribeCloudRealtime(){
  if(cloudChannel) return;
  cloudChannel = sb.channel("roster-app-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"houses" }, ()=>{
      sb.from("houses").select("*").then(({data})=>{ if(data){ state.houses=data.map(h=>({id:h.id,name:h.name,pin:h.pin||""})); saveKey("ndis-houses",state.houses); render(); } });
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"staff" }, ()=>{
      sb.from("staff").select("*").then(({data})=>{ if(data){ state.staff=data.map(s=>({id:s.id,name:s.name})); saveKey("ndis-staff",state.staff); render(); } });
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"participants" }, ()=>{
      sb.from("participants").select("*").then(({data})=>{ if(data){ state.participants=data.map(p=>({id:p.id,name:p.name,houseId:p.house_id,active:p.active})); saveKey("ndis-participants",state.participants); render(); } });
    })
    .subscribe();
}

// Night Support Monitoring app), which is how that separate app finds out which
// participants belong to which house, and whether a house phone needs a PIN.
function houseSlug(house){ return house.name.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
function buildHouseLink(house){

/* ---------------------------------------------------------
   Derived helpers
--------------------------------------------------------- */
function today(){ return todayStr(); }
function todayDay(){ return DAY_BY_INDEX[new Date().getDay()]; }
function participantName(id){ return state.participants.find(p=>p.id===id)?.name || "Unknown"; }
function scheduledToday(){
  const d = todayDay();
  return state.participants.filter(p => p.active && (state.rosters[p.id]||[]).some(shift => shift.days.includes(d)));
}
function shiftsToday(participantId){
  const d = todayDay();
  return (state.rosters[participantId]||[]).filter(shift => shift.days.includes(d));
}
// Picks which of today's shift blocks a "Service Completed" click refers to:
// prefer the shift whose time window contains the current time (handles overnight
// shifts too); fall back to whichever shift starts closest to now.
function currentShiftForParticipant(participantId){
  const shifts = shiftsToday(participantId);
  if(shifts.length===0) return null;
  const now = new Date();
  const nowMins = now.getHours()*60 + now.getMinutes();
  const toMins = t => { if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
  for(const sh of shifts){
    const s = toMins(sh.startTime), f = toMins(sh.finishTime);
    if(s===null || f===null) continue;
    const inWindow = s<=f ? (nowMins>=s && nowMins<f) : (nowMins>=s || nowMins<f); // s>f = overnight
    if(inWindow) return sh;
  }
  return shifts.slice().sort((a,b)=>{
    const da = Math.abs((toMins(a.startTime)??0) - nowMins);
    const db = Math.abs((toMins(b.startTime)??0) - nowMins);
    return da-db;
  })[0];
}
// If a shift doesn't have an explicit NDIS line item saved, try to match one
// from the central master list using the shift's service type + ratio.
function deriveLineItem(serviceType, ratio){
  if(!serviceType) return "";
  const exact = state.lineItems.find(li => li.toLowerCase().includes(serviceType.toLowerCase()) && (!ratio || li.includes(ratio)));
  if(exact) return exact;
  const loose = state.lineItems.find(li => li.toLowerCase().includes(serviceType.toLowerCase()));
  return loose || "";
}
function fmtTime(t){ return t || "—"; }
function todayStatus(participantId){
  const t = today();
  const entries = state.logs.filter(l => l.participantId===participantId && l.date===t && (l.type==="completed"||l.type==="cancelled"));
  return entries.length ? entries[entries.length-1] : null;
}
function staffSuggestions(){
  const s = new Set(); state.logs.forEach(l=>{ if(l.staff) s.add(l.staff); }); return Array.from(s);
}
function todayStats(){
  let completed=0, cancelled=0, pending=0;
  scheduledToday().forEach(p=>{
    const s = todayStatus(p.id);
    if(s?.type==="completed") completed++;
    else if(s?.type==="cancelled") cancelled++;
    else pending++;
  });
  const t = today();
  const extra = state.logs.filter(l=>l.type==="extra" && l.date===t).length;
  const km = state.logs.filter(l=>l.type==="transport" && l.date===t).reduce((sum,l)=>sum+(Number(l.totalKm)||0),0);
  const supported = new Set(state.logs.filter(l=>l.type==="completed" && l.date===t).map(l=>l.participantId)).size;
  return { completed, cancelled, pending, extra, km, supported };
}
function reportRows(){
  const r = state.report;
  let rows = state.logs;
  if(r.type!=="all") rows = rows.filter(l=>l.type===r.type);
  if(r.participant!=="all") rows = rows.filter(l=>l.participantId===r.participant);
  if(r.staff.trim()) rows = rows.filter(l=>(l.staff||"").toLowerCase().includes(r.staff.trim().toLowerCase()));
  if(r.from) rows = rows.filter(l=>l.date>=r.from);
  if(r.to) rows = rows.filter(l=>l.date<=r.to);
  return rows.slice().sort((a,b)=> a.date<b.date?1:-1);
}

function addHouse(e){
  e.preventDefault();

  const house = { id: uid(), name, pin:"" };
  state.houses.push(house);
  saveHouses(); render();
  sb.from("houses").upsert({ id:house.id, name:house.name, pin:"" }).then(({error})=>{ if(error) console.error(error); });
  return false;
}
function removeHouse(id){
  if(!confirm("Delete this house? Participants assigned to it will become unassigned.")) return;
  state.houses = state.houses.filter(h=>h.id!==id);
  state.participants = state.participants.map(p=>p.houseId===id ? {...p, houseId:null} : p);

  sb.from("houses").delete().eq("id", id).then(({error})=>{ if(error) console.error(error); });

function setHousePin(id, pin){

  state.houses = state.houses.map(h=>h.id===id ? {...h, pin:clean} : h);
  saveHouses(); render();
  const houseName = state.houses.find(h=>h.id===id)?.name || "";

function copyHouseLink(id){
  const h = state.houses.find(x=>x.id===id);
  const tmp = document.createElement("input");
  tmp.value = buildHouseLink(h);
  document.body.appendChild(tmp); tmp.select();
  document.execCommand && document.execCommand("copy");
  navigator.clipboard?.writeText(tmp.value).catch(()=>{});
  document.body.removeChild(tmp);
}

function addShift(){
  const serviceType = val("shift-service").trim();
  if(!serviceType){ alert("Enter a service type."); return; }
  if(draftDays.size===0){ alert("Select at least one day."); return; }
  const rid = state.rosterParticipantId;
  if(!state.rosters[rid]) state.rosters[rid] = [];
  state.rosters[rid].push({
    id: uid(), serviceType,
    days: WEEK_ORDER.filter(d=>draftDays.has(d)),
    startTime: val("shift-start"), finishTime: val("shift-finish"),
    ratio: val("shift-ratio") || "1:1", label: val("shift-label").trim(),
  });
  saveRosters(); render();
}
function removeShift(shiftId){
  const rid = state.rosterParticipantId;
  state.rosters[rid] = state.rosters[rid].filter(sh=>sh.id!==shiftId);
  saveRosters(); render();
}

--------------------------------------------------------- */
function openModal(type, participantId){ state.modal = { type, participantId }; renderModal(); }
function closeModal(){ state.modal = null; document.getElementById("modal-root").innerHTML = ""; }

function renderModal(){
  const root = document.getElementById("modal-root");
  if(!state.modal){ root.innerHTML = ""; return; }
  const { type, participantId } = state.modal;
  const p = state.participants.find(x=>x.id===participantId);
  const meta = {
    complete:{ title:`Service Completed — ${p.name}`, tone:"bg-emerald-700" },
    cancel:{ title:`Cancelled — ${p.name}`, tone:"bg-rose-700" },
    extra:{ title:`Extra Service — ${p.name}`, tone:"bg-amber-600" },
    transport:{ title:`Transport — ${p.name}`, tone:"bg-teal-800" },
  }[type];
  const todaysServiceOptions = shiftsToday(p.id).map(sh=>sh.serviceType);
  const staffList = staffSuggestions().map(s=>`<option value="${esc(s)}">`).join("");

  let body = "";
  if(type==="complete"){
    const shifts = shiftsToday(p.id);
    const activeShift = currentShiftForParticipant(p.id);
    const shiftChips = shifts.map(sh=>`
      <div class="text-xs px-2.5 py-1.5 rounded-lg border ${activeShift && sh.id===activeShift.id ? "bg-teal-50 border-teal-300 text-teal-800 font-medium" : "bg-white border-slate-200 text-slate-500"}">
        ${sh.startTime ? `${fmtTime(sh.startTime)}–${fmtTime(sh.finishTime)}` : "No time set"} · ${esc(sh.serviceType)} · ${esc(sh.ratio)}${sh.label?` · ${esc(sh.label)}`:""}
      </div>`).join("");
    body = `
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-4">
        <div class="text-xs text-slate-500 mb-0.5">Participant</div>
        <div class="font-semibold text-slate-800 mb-2">${esc(p.name)}</div>
        <div class="text-xs text-slate-500 mb-1.5">Scheduled ${esc(todayDay())}, ${fmtDate(today())}</div>
        <div class="space-y-1.5">${shiftChips || `<div class="text-xs text-slate-400">No rostered shift found for today — this will be saved as an ad hoc completion.</div>`}</div>
      </div>
      ${field("Description (required)", `<textarea required id="f-description" rows="3" class="${inputCls}" placeholder="What support was provided"></textarea>`)}
      ${field("Notes (optional)", `<textarea id="f-notes" rows="2" class="${inputCls}"></textarea>`)}
    `;
  } else if(type==="cancel"){
    body = `
      ${field("Cancellation reason", `<select id="f-reason" class="${inputCls}">${CANCEL_REASONS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select>`)}
      ${field("Notes (optional)", `<textarea id="f-notes" rows="3" class="${inputCls}"></textarea>`)}
    `;
  } else if(type==="extra"){
    body = `
      ${field("Participant", `<select id="f-participant" class="${inputCls}">${state.participants.map(pp=>`<option value="${pp.id}" ${pp.id===p.id?"selected":""}>${esc(pp.name)}</option>`).join("")}</select>`)}
      ${field("Date", `<input type="date" required id="f-date" value="${today()}" class="${inputCls}" />`)}
      ${field("Service type", `<select id="f-serviceType" onchange="onExtraServiceTypeChange()" class="${inputCls}">${EXTRA_SERVICE_TYPES.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select>`)}
      <div id="billing-note" class="hidden mb-3 text-xs font-medium text-teal-700 bg-teal-50 border border-teal-200 rounded-lg px-3 py-2"></div>
      ${field("Reason", `<input required id="f-reason" class="${inputCls}" />`)}
      ${field("Description", `<textarea id="f-description" rows="2" class="${inputCls}"></textarea>`)}
      ${field("Notes (optional)", `<textarea id="f-notes" rows="2" class="${inputCls}"></textarea>`)}
    `;
  } else if(type==="transport"){
    body = `
      <div class="grid grid-cols-2 gap-3">
        ${field("Vehicle", `<input required id="f-vehicle" class="${inputCls}" placeholder="e.g. Toyota Hiace — ABC123" />`)}
        ${field("Driver", `<input required id="f-driver" class="${inputCls}" />`)}
      </div>
      <div class="grid grid-cols-3 gap-3">
        ${field("Start odometer", `<input type="number" required id="f-startOdo" oninput="updateKmPreview()" class="${inputCls}" />`)}
        ${field("Finish odometer", `<input type="number" required id="f-finishOdo" oninput="updateKmPreview()" class="${inputCls}" />`)}
        ${field("Total km", `<input disabled id="f-totalKm" class="${inputCls} bg-slate-100" value="" />`)}
      </div>
      <div class="grid grid-cols-2 gap-3">
        ${field("Destination", `<input required id="f-destination" class="${inputCls}" />`)}
        ${field("Return destination", `<input id="f-returnDestination" class="${inputCls}" />`)}
      </div>
      ${field("Fuel used (optional, L)", `<input type="number" id="f-fuelUsed" class="${inputCls}" />`)}
    `;
  }

  root.innerHTML = `
  <div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4" onclick="if(event.target===this) closeModal()">
    <div class="bg-white rounded-xl shadow-xl w-full ${type==='transport'?'max-w-2xl':'max-w-md'} max-h-[90vh] overflow-y-auto">
      <div class="${meta.tone} text-white px-5 py-4 rounded-t-xl flex items-center gap-2">
        <h3 class="font-semibold font-display">${esc(meta.title)}</h3>
        <button onclick="closeModal()" class="ml-auto text-white/80 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-5">
        <form onsubmit="return submitModal(event)">
          ${body}
          <button type="submit" class="w-full bg-teal-800 hover:bg-teal-900 text-white font-medium py-2.5 rounded-lg mt-2">Save record</button>
        </form>
      </div>
    </div>
  </div>`;
  lucide.createIcons();
  if(type==="extra") onExtraServiceTypeChange();
}
function updateKmPreview(){
  const s = Number(document.getElementById("f-startOdo").value);
  const f = Number(document.getElementById("f-finishOdo").value);
  document.getElementById("f-totalKm").value = (document.getElementById("f-startOdo").value!=="" && document.getElementById("f-finishOdo").value!=="") ? Math.max(0, f-s) : "";
}
// Shows a quiet, read-only preview of how a service type will be billed —
// informational only, never blocks or requires staff input.
function onExtraServiceTypeChange(){
  const note = document.getElementById("billing-note");
  if(!note) return;
  const cfg = EXTRA_SERVICE_CONFIG[val("f-serviceType")];
  if(cfg){
    note.textContent = `Will be billed as: ${cfg.billingType || cfg.lineItem} (${cfg.ratio})`;
    note.classList.remove("hidden");
  } else {
    note.classList.add("hidden");
  }
}
function val(id){ const el = document.getElementById(id); return el ? el.value : ""; }
function submitModal(e){
  e.preventDefault();
  const { type, participantId } = state.modal;
  const t = today();
  let entry = { id: uid(), createdAt: new Date().toISOString(), participantId };
  if(type==="complete"){
    // All shift/billing detail is derived from the matched roster shift — staff
    // only ever type the Description and optional Notes.
    const shift = currentShiftForParticipant(participantId);
    entry = { ...entry, type:"completed", date:t,
      startTime: shift?.startTime || "", finishTime: shift?.finishTime || "",
      staff: "", location: "",
      supportType: shift?.serviceType || "", ratio: shift?.ratio || "",
      lineItem: shift?.lineItem || deriveLineItem(shift?.serviceType, shift?.ratio),
      description: val("f-description"), notes: val("f-notes"),
    };
    state.logs.push(entry);
  } else if(type==="cancel"){
    entry = { ...entry, type:"cancelled", date:t, reason:val("f-reason"), notes:val("f-notes") };
    state.logs.push(entry);
  } else if(type==="extra"){
    const chosenParticipantId = val("f-participant") || participantId;
    const serviceType = val("f-serviceType");
    const cfg = EXTRA_SERVICE_CONFIG[serviceType] || {};
    const nowIso = new Date().toISOString();
    state.logs.push({
      id: uid(), createdAt: nowIso, participantId: chosenParticipantId, type:"extra",
      date: val("f-date"), serviceType,
      fundingType: cfg.fundingType || "", ratio: cfg.ratio || "", lineItem: cfg.lineItem || "",
      billingType: cfg.billingType || "",
      reason: val("f-reason"), description: val("f-description"), notes: val("f-notes"),
      createdBy: state.role, createdDate: nowIso, lastModified: nowIso,
    });
  } else if(type==="transport"){
    const s = Number(val("f-startOdo")), f = Number(val("f-finishOdo"));
    entry = { ...entry, type:"transport", date:t, vehicle:val("f-vehicle"), driver:val("f-driver"), startOdo:s, finishOdo:f, totalKm:Math.max(0,f-s), destination:val("f-destination"), returnDestination:val("f-returnDestination"), fuelUsed:val("f-fuelUsed") };
    state.logs.push(entry);
  }
  saveLogs();
  closeModal();
  render();
  return false;
}

function render(){
  let content = "";
  if(state.tab==="dashboard") content = renderDashboard();
  else if(state.tab==="today") content = renderToday();
  else if(state.tab==="participants" && state.role==="admin") content = renderParticipants();
  else if(state.tab==="roster" && state.role==="admin") content = renderRoster();
  else if(state.tab==="reports") content = renderReports();
  else { state.tab = "dashboard"; content = renderDashboard(); }

  document.getElementById("app").innerHTML = `
    ${renderTopbar()}
    ${renderNav()}
    <div class="p-4 md:p-6 max-w-7xl mx-auto">${content}</div>
  `;
  lucide.createIcons();
}
window.setState = setState;
document.getElementById("app").innerHTML = `<div class="min-h-screen flex items-center justify-center text-slate-400 text-sm">Loading…</div>`;
bootCloudData();
</script>
</body>
</html>
